[package]
name = "lmsheets-inspect-web"
license = "MIT OR Apache-2.0"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# The inspector in the browser (docs/redraw-plan.md chunk 20): Leptos chrome
# over lmsheets-inspector's pure model, lmsheets-gpu on WebGPU for the two
# panes. Its own crate, Trunk.toml and dist (the old prototype viewer is
# untouched). The wasm-only code is behind cfg, so the workspace builds
# natively too.
[dependencies]
lmsheets-document = { path = "../document" }
lmsheets-render = { path = "../render" }
lmsheets-gpu = { path = "../gpu" }
lmsheets-inspector = { path = "../inspector" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu", "wgsl", "std"] }
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "DomTokenList", "HtmlElement", "HtmlCanvasElement",
    "DomRect", "PointerEvent", "WheelEvent", "MouseEvent", "KeyboardEvent", "Navigator",
    "CssStyleDeclaration", "Performance", "Location", "Response", "Blob",
    "ImageBitmap", "ImageBitmapOptions", "ColorSpaceConversion", "PremultiplyAlpha",
    "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageData",
    "MediaQueryList", "Event", "EventTarget", "console",
] }
