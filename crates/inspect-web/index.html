<script>
  // The look before the page is up: the system's scheme.
  if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "hud";
  // No WebGPU: the static page, without loading the viewer. (?nogpu=1 pretends.)
  if (!navigator.gpu || /[?&]nogpu\b/.test(location.search)) {
    location.replace("fallback.html?reason=" + encodeURIComponent("WebGPU is not available in this browser."));
  }
</script>
