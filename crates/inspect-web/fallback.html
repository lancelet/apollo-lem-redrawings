<!doctype html>
<html lang="en" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apollo LEM redrawings (static)</title>
<link rel="icon" href="data:,">
<script>
  if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "hud";
</script>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { overflow: auto; height: auto; }
  .static { max-width: 1500px; margin: 0 auto; padding: 0 16px 48px; }
  .static .bar { grid-column: auto; margin: 0 -16px 16px; min-height: 44px; flex-wrap: wrap; }
  .static .reason { color: var(--accent2); margin: 8px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .static .note { color: var(--muted); margin: 0 0 16px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .pair figure { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 8px; }
  .pair img { display: block; width: 100%; height: auto; background: #fff; }
  .pair figcaption { color: var(--muted); padding: 6px 2px 0; font-size: 12px; }
  .about-body { max-width: 760px; margin-top: 28px; font-size: 14px; line-height: 1.55; }
  .about-body a { color: var(--accent); }
  @media (max-width: 820px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="static">
  <div class="bar">
    <span class="wordmark">lm<b>sheets</b></span>
    <span class="doc-title" id="title"><b>LDW280-17619 sheet 3, redrawn</b></span>
  </div>
  <p class="reason" id="reason">The interactive viewer needs WebGPU.</p>
  <p class="note">This is the static view: the redraw and the original scan, side by side. The interactive viewer (hover to light an item in both, pin to see its constraints and evidence) needs a current Chrome, Edge or Safari with WebGPU.</p>
  <div class="pair">
    <figure><img id="redraw" alt="The redrawn sheet" width="3400" height="2200"><figcaption>The redraw, on its paper.</figcaption></figure>
    <figure><img id="scan" alt="The original scan" width="1656" height="1091"><figcaption>The original scan, cropped to the drawing.</figcaption></figure>
  </div>
  <div class="about-body" id="about"></div>
  <noscript><p class="note">This page needs JavaScript only to find the pictures; the sheet's folder is listed in index.json.</p></noscript>
</div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get("reason")) document.getElementById("reason").textContent = q.get("reason");
  try {
    const idx = await (await fetch("index.json")).json();
    const s = idx.sheets[0];
    if (s.title) document.getElementById("title").innerHTML = "<b></b>", document.querySelector("#title b").textContent = s.title;
    const w = s.fallback || {};
    for (const k of ["redraw", "scan"]) {
      const img = document.getElementById(k);
      img.src = s.path + (w[k] || k + ".png");
    }
  } catch (e) { /* no index: the images stay empty */ }
  try {
    document.getElementById("about").innerHTML = await (await fetch("about.html")).text();
  } catch (e) {}
})();
</script>
</body>
</html>
