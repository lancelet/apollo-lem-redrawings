<script>
  // The look before the page is up: the system's scheme.
  if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "hud";
  // No WebGPU: the static page, without loading the viewer. (?nogpu=1 pretends.)
  if (!navigator.gpu || /[?&]nogpu\b/.test(location.search)) {
    location.replace("fallback.html?reason=" + encodeURIComponent("WebGPU is not available in this browser."));
  }
</script>
<script>
  // ?debug: every console message and error, with the time since load and
  // the build, in a panel over the page (for a phone, where there is no
  // console to read). Added first, so it sees everything after it.
  if (/[?&]debug\b/.test(location.search)) (function () {
    var t0 = performance.now(), lines = [], pre = null;
    var put = function (kind, args) {
      var text = Array.prototype.map.call(args, function (a) {
        if (a && a.stack) return (a.name || "Error") + ": " + a.message + " | " + String(a.stack).split("\n").slice(0, 3).join(" | ");
        if (a && typeof a === "object") { try { return JSON.stringify(a); } catch (e) { return String(a); } }
        return String(a);
      }).join(" ");
      lines.push(((performance.now() - t0) / 1000).toFixed(2) + "s " + kind + ": " + text);
      if (!pre && document.body) {
        pre = document.createElement("pre");
        pre.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:60%;overflow:auto;z-index:1000;margin:0;padding:8px;font:11px/1.35 monospace;white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.85);color:#fff;";
        document.body.appendChild(pre);
      }
      if (pre) pre.textContent = "build " + (window.LMS_BUILD || "?") + " | " + navigator.userAgent + "\n" + lines.join("\n");
    };
    ["log", "info", "warn", "error", "debug"].forEach(function (k) {
      var f = console[k];
      console[k] = function () { put(k, arguments); return f.apply(console, arguments); };
    });
    window.addEventListener("error", function (ev) { put("error event", [ev.error || ev.message, ev.filename + ":" + ev.lineno]); }, true);
    window.addEventListener("unhandledrejection", function (ev) { put("unhandled rejection", [ev.reason]); });
    document.addEventListener("DOMContentLoaded", function () { put("info", ["page loaded"]); });
  })();
</script>
<script>
  // The indicator in <body> (#boot): the viewer's download with its bytes, then
  // the sheet's loading; the viewer removes it when the first frame is drawn.
  // The .wasm is the bulk of a first visit, so its response body is counted as
  // it streams. Its length is the Content-Length when the body comes as it is;
  // a compressed body's is the compressed length, so then site.sh's WASM_BYTES
  // (the file's size) stands in, or only the bytes received are shown.
  (function () {
    var WASM_BYTES = 2570638; // the wasm file's size, set by site.sh
    // The build (the commit and the day it was built), set by site.sh; every
    // failure message carries it, so a report names the version that failed.
    window.LMS_BUILD = "4c86112, 2026-11-01";
    var el = function (id) { return document.getElementById(id); };
    var show = function (phase, got, total) {
      var phaseEl = el("boot-phase");
      if (!phaseEl) return;
      phaseEl.textContent = phase;
      var track = el("boot-track");
      var mb = function (n) { return (n / 1e6).toFixed(1); };
      if (got == null) { track.hidden = true; el("boot-bytes").textContent = ""; return; }
      track.hidden = !total;
      if (total) {
        var pct = Math.min(100, Math.round(100 * got / total));
        el("boot-fill").style.width = pct + "%";
        track.setAttribute("aria-valuenow", pct);
      }
      el("boot-bytes").textContent = total ? mb(got) + " of " + mb(total) + " MB" : mb(got) + " MB";
    };
    // Say as much as helps a diagnosis: the step, the error's name, message
    // and first stack lines, the file, and the browser.
    var failed = function (step, e, file) {
      var lines = ["The viewer could not be loaded.", "Step: " + step];
      if (e && typeof e === "object") {
        lines.push("Error: " + (e.name || "Error") + ": " + (e.message || String(e)));
        if (e.stack) lines.push("Stack: " + String(e.stack).split("\n").slice(0, 4).join(" | "));
      } else if (e != null) {
        lines.push("Error: " + e);
      }
      if (file) lines.push("File: " + file);
      lines.push("Browser: " + navigator.userAgent);
      lines.push("Build: " + window.LMS_BUILD);
      if (/[?&]debug\b/.test(location.search)) { console.error(lines.join(" / ")); return; }
      location.replace("fallback.html?reason=" + encodeURIComponent(lines.join("\n").slice(0, 1800)));
    };
    // Anything thrown while the viewer starts (the loading indicator is still
    // up), such as the wasm failing to compile, goes to the static page too.
    var starting = function () { return !!document.getElementById("boot"); };
    window.addEventListener("error", function (ev) {
      if (starting()) failed("starting the viewer", ev.error || ev.message, ev.filename);
    });
    window.addEventListener("unhandledrejection", function (ev) {
      if (starting()) failed("starting the viewer", ev.reason);
    });
    // Bound: WebKit refuses a fetch called on anything but the window (the
    // wasm loader calls it bare, from a module, where `this` is undefined).
    var plain = window.fetch.bind(window);
    window.fetch = function (input) {
      var url = typeof input === "string" ? input : (input && input.url) || String(input);
      var result = plain.apply(null, arguments);
      if (!/\.wasm([?#]|$)/.test(url)) return result;
      return result.then(function (r) {
        if (!r.ok) { failed("fetching the viewer", "HTTP " + r.status, url); return r; }
        // The loader gets the response untouched; a clone is read to count
        // the bytes. (A response rebuilt around a counting stream kept the
        // compressed Content-Length over the decoded body, which WebKit
        // refuses: "TypeError: Load failed".) Counting is best effort: if
        // it fails, the bar stops and the viewer still loads.
        try {
          var length = +r.headers.get("content-length") || 0;
          var total = r.headers.get("content-encoding") ? WASM_BYTES : (length || WASM_BYTES);
          var got = 0;
          var reader = r.clone().body.getReader();
          show("Downloading the viewer", 0, total);
          var step = function () {
            reader.read().then(function (x) {
              if (x.done) { show("Loading the sheet\u2026"); return; }
              got += x.value.length;
              show("Downloading the viewer", got, total);
              step();
            }, function () {});
          };
          step();
        } catch (e) {}
        return r;
      }, function (e) { failed("fetching the viewer", e, url); throw e; });
    };
  })();
</script>
